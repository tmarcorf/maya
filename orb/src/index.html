<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Sonic Orb</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap" nonce="__NONCE__">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>

  <body>
    <div id="stage">
      <canvas id="scene"></canvas>
    </div>

    <div id="titlebar">
      <span class="brand">SONIC ORB</span>
    </div>

    <main id="ui">
      <section class="panel">
        <div class="row sources">
          <button class="src" data-source="mic" title="Atalho: 1">Microfone</button>
          <button class="src" data-source="system" title="Atalho: 2">Áudio do sistema</button>
          <button class="src" data-source="file" title="Atalho: 3">Arquivo…</button>
          <button class="src" data-source="demo" title="Atalho: 4">Demo</button>
          <button class="src ghost" data-source="none" title="Atalho: 0">Parar</button>
        </div>

        <div class="row meters">
          <canvas id="meter" width="520" height="46"></canvas>
        </div>

        <div class="row sliders">
          <label>
            <span>Sensibilidade</span>
            <input id="sensitivity" type="range" min="0.2" max="3" step="0.01" value="1" />
          </label>
          <label>
            <span>Turbulência</span>
            <input id="turbulence" type="range" min="0" max="2.5" step="0.01" value="1" />
          </label>
          <label>
            <span>Detalhe</span>
            <input id="detail" type="range" min="0" max="1.5" step="0.01" value="0.5" />
          </label>
          <label>
            <span>Velocidade</span>
            <input id="speed" type="range" min="0" max="3" step="0.01" value="1" />
          </label>
          <label>
            <span>Brilho</span>
            <input id="glow" type="range" min="0" max="2" step="0.01" value="1" />
          </label>
          <label>
            <span>Bloom</span>
            <input id="bloom" type="range" min="0" max="2.5" step="0.01" value="0.9" />
          </label>
          <label class="palette">
            <span>Paleta</span>
            <select id="palette"></select>
          </label>
        </div>

        <div class="row status">
          <span id="source-label">Nenhuma fonte</span>
          <span class="dot">•</span>
          <span id="fps">-- fps</span>
          <span class="spacer"></span>
          <span class="hint">H oculta · F tela cheia · S captura · Espaço pausa · R reseta câmera</span>
        </div>
      </section>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>
    <div id="drop-hint">Solte o arquivo de áudio</div>

    <input id="file-input" type="file" accept="audio/*" hidden />

    <script type="module" src="./app.js" nonce="__NONCE__"></script>
  </body>
</html>
