<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Glifo do orb em escala de tray — fundo transparente. -->
  <defs>
    <linearGradient id="orb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3d10"/>
      <stop offset="55%" stop-color="#9d5ad8"/>
      <stop offset="100%" stop-color="#2ec5ff"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.35" cy="0.28" r="0.85">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
    </filter>
  </defs>
  <circle cx="16" cy="16" r="13" fill="#9d5ad8" opacity="0.45" filter="url(#glow)"/>
  <circle cx="16" cy="16" r="13" fill="url(#orb)"/>
  <circle cx="16" cy="16" r="13" fill="url(#sheen)"/>
  <circle cx="16" cy="16" r="13" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
</svg>
